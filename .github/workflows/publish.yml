name: Publish plugin release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore, build, and test
        run: |
          dotnet restore Jellyfin.Plugin.LibraryCurator.sln
          dotnet build Jellyfin.Plugin.LibraryCurator.sln -c Release --no-restore -m:1
          dotnet test Jellyfin.Plugin.LibraryCurator.sln -c Release --no-build --no-restore -m:1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test web renderer
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Publish plugin files
        run: dotnet publish src/Jellyfin.Plugin.LibraryCurator/Jellyfin.Plugin.LibraryCurator.csproj -c Release --no-build --no-restore -o ./publish
      - name: Package and validate version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/package.py --tag "$TAG"
      - name: Upload release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "packages/library-curator-${TAG#v}.zip" --clobber
      - name: Update repository package and manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p /tmp/library-curator-release
          cp manifest.json /tmp/library-curator-release/manifest.json
          cp "packages/library-curator-${TAG#v}.zip" /tmp/library-curator-release/
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p packages
          cp /tmp/library-curator-release/manifest.json manifest.json
          cp "/tmp/library-curator-release/library-curator-${TAG#v}.zip" packages/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json packages/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish plugin ${TAG}"
          git push origin main
